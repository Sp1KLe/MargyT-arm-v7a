name: Build MargyT (armeabi-v7a)

# The universal armeabi-v7a TikTok apk is ~350 MB and does not live in git.
# Upload it once as an asset of a release (any tag, e.g. "base"), then run this
# workflow and give it the asset's name and tag.
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Release tag that holds the TikTok armeabi-v7a apk"
        default: "base"
      base_asset:
        description: "File name of that apk"
        default: "tiktok-47.2.41-armeabi-v7a.apk"
      base_sha256:
        description: "Optional sha256 of the base apk to verify"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch base apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.base_tag }}" -p "${{ inputs.base_asset }}" -O base.apk
          if [ -n "${{ inputs.base_sha256 }}" ]; then
            echo "${{ inputs.base_sha256 }}  base.apk" | sha256sum -c -
          fi
          unzip -l base.apk | grep -E "lib/(armeabi-v7a|arm64-v8a)/" | awk '{print $4}' | cut -d/ -f1-2 | sort | uniq -c
      - name: Python dependencies
        run: pip install pillow bsdiff4
      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          bash build.sh base.apk -o build/margyt-armeabi-v7a.apk 2>&1 | tee build/build.log
      - name: Check ABI is intact
        run: |
          unzip -l build/margyt-armeabi-v7a.apk | grep -q "lib/armeabi-v7a/" || { echo "no armeabi-v7a libs in result"; exit 1; }
          ls -l build/margyt-armeabi-v7a.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          tag="v$v-armeabi-v7a"
          gh release create "$tag" build/margyt-armeabi-v7a.apk --title "MargyT $v (armeabi-v7a)" --notes "MargyT $(cat VERSION-NAME), built from a TikTok armeabi-v7a base." || gh release upload "$tag" build/margyt-armeabi-v7a.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: margyt-armeabi-v7a
          path: build/margyt-armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
